<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alvin Cloud</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body>


<div class="container">

<div class="header">
<h1>☁️ Alvin Cloud</h1>
<p id="userEmail">Memuat...</p>
</div>



<div class="menu">


<div class="card">
<div class="icon">🏠</div>
<h3>Home</h3>
<p>Beranda</p>
</div>


<div class="card">
<div class="icon">👤</div>
<h3>Profil</h3>
<p>Akun Saya</p>
</div>


<div class="card" onclick="uploadFile()">
<div class="icon">📂</div>
<h3>File</h3>
<p>Upload File</p>
</div>


<div class="card" onclick="uploadVideo()">
<div class="icon">🎬</div>
<h3>Video</h3>
<p>Upload Video</p>
</div>


<div class="card" onclick="uploadPhoto()">
<div class="icon">🖼️</div>
<h3>Galeri</h3>
<p>Upload Foto</p>
</div>


<div class="card">
<div class="icon">⚙️</div>
<h3>Setting</h3>
<p>Pengaturan</p>
</div>


</div>



<input hidden id="fileInput" type="file">


<button id="logoutBtn">
🚪 Logout
</button>


</div>



<script type="module" src="dashboard.js"></script>

</body>
</html>
